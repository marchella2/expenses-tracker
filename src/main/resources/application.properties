# server configuration
server.port=${APP_SERVER_PORT:8082}
spring.application.name=${APP_NAME:expenses}

# database configuration
spring.datasource.url=${DB_POSTGRES_URL}
spring.datasource.username=${DB_POSTGRES_USERNAME}
spring.datasource.password=${DB_POSTGRES_PASSWORD}

# jpa configuration
#configuration for database schema management
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
logging.level.org.hibernate.orm.jdbc.bind=${JPA_BIND_LOGGING:TRACE}